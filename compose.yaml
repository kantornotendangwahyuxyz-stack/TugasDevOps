name: devops-git-test

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: git-test-app:1.0.0
    container_name: devops_web_app
    restart: always
    ports:
      - "${PORT:-8080}:80"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_NAME=${APP_NAME:-DevOpsGitTestApp}
